<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#31164f"><title>📖 Luméo — Le livre magique</title><meta name="description" content="Feuillette le livret officiel de Luméo comme un vrai livre !"><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:white;background:#180d2b}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 15% 12%,#60318a99,transparent 45%),radial-gradient(ellipse at 85% 80%,#17609a66,transparent 42%),#180d2b}header{text-align:center;padding:20px 12px 4px}h1{font-size:clamp(22px,3.4vw,34px);margin:0}header p{color:#e8d6ff;margin:7px 0;font-size:14px}.stage{display:flex;align-items:center;justify-content:center;gap:12px;padding:14px 8px 8px;min-height:300px}.book{position:relative;width:min(78vw,1040px);aspect-ratio:1190/842;display:flex;perspective:1900px;filter:drop-shadow(0 18px 25px #000a)}.page{width:50%;height:100%;background:#fff;position:relative;overflow:hidden}.page img{display:block;width:100%;height:100%;object-fit:fill}.left{border-radius:12px 1px 1px 12px;box-shadow:inset -15px 0 18px -14px #0007}.right{border-radius:1px 12px 12px 1px;box-shadow:inset 15px 0 18px -14px #0007}.page.blank{background:linear-gradient(110deg,#e7d7f7,#fff 90%)}.book:after{content:'';position:absolute;left:calc(50% - 2px);top:0;bottom:0;width:4px;background:linear-gradient(90deg,#0003,#fff8,#0003);pointer-events:none;z-index:3}.turn{position:absolute;top:0;width:50%;height:100%;z-index:5;transform-style:preserve-3d;pointer-events:none;transition:transform .68s cubic-bezier(.2,.65,.2,1)}.turn.forward{left:50%;transform-origin:left center}.turn.backward{left:0;transform-origin:right center}.turn.forward.animate{transform:rotateY(-180deg)}.turn.backward.animate{transform:rotateY(180deg)}.turn-face{position:absolute;inset:0;backface-visibility:hidden;background:#fff;overflow:hidden;box-shadow:0 0 12px #0004}.turn-face img{width:100%;height:100%;display:block}.turn-back{transform:rotateY(180deg)}.arrow{background:#ffffff18;color:#fff;border:1px solid #ffffff66;border-radius:50%;width:48px;height:48px;font-size:29px;cursor:pointer;flex-shrink:0}.arrow:hover{background:#a76ce688}.arrow:disabled{opacity:.25;cursor:default}.controls{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:14px 12px 8px}button,.download{font:inherit}.small{border:1px solid #b996e7;background:#492771;color:#fff;border-radius:30px;padding:10px 16px;cursor:pointer;text-decoration:none}.small:hover{background:#7043a3}.counter{min-width:125px;text-align:center;font-weight:700}.hint{text-align:center;color:#d8c5ed;font-size:13px;padding:4px 12px 22px}.mobile-only{display:none}@media(max-width:680px){header{padding-top:12px}.stage{gap:4px;padding:10px 2px 0}.book{width:min(79vw,490px);aspect-ratio:595/842}.book .left{display:none}.book .right{width:100%;border-radius:8px}.book:after{display:none}.arrow{width:32px;height:43px;border-radius:10px;font-size:23px}.controls{gap:7px}.small{padding:8px 11px;font-size:13px}.counter{min-width:80px}.mobile-only{display:block}.turn{width:100%!important;left:0!important;transform-origin:left center!important}.turn.backward{transform-origin:right center!important}}@media(prefers-reduced-motion:reduce){.turn{transition:none}}
</style></head><body><header><h1>🤖💜 Le livre magique de Luméo ✨</h1><p>Ouvre mon livre et découvre toutes mes surprises ! 🌈</p></header><main><div class="stage"><button id="prev" class="arrow" aria-label="Pages précédentes">‹</button><div id="book" class="book" aria-label="Livret interactif de Luméo"><div class="page left blank" id="left"></div><div class="page right" id="right"></div></div><button id="next" class="arrow" aria-label="Pages suivantes">›</button></div><div class="controls"><span id="counter" class="counter" aria-live="polite"></span><button id="first" class="small">⏮ Début</button><button id="last" class="small">Fin ⏭</button><button id="full" class="small">⛶ Plein écran</button><a class="small download" href="Presentation_Lumeo.pdf" download>⬇ PDF</a></div><p class="hint">💜 Sur ordinateur : deux pages comme un vrai livre ! Sur téléphone : une page lisible à la fois. Utilise les flèches ← → ou glisse le doigt.</p></main><script>
const TOTAL=15,book=document.getElementById('book'),left=document.getElementById('left'),right=document.getElementById('right'),counter=document.getElementById('counter');let current=0,busy=false;const isMobile=()=>matchMedia('(max-width:680px)').matches;const src=n=>`pages/page-${String(n).padStart(2,'0')}.webp`;for(let n=1;n<=TOTAL;n++){const i=new Image();i.src=src(n)}
function maxIndex(){return isMobile()?TOTAL-1:Math.ceil((TOTAL+1)/2)-1}function spread(i){return isMobile()?[null,i+1]:i===0?[null,1]:[2*i,2*i+1<=TOTAL?2*i+1:null]}
function paint(el,n){el.classList.toggle('blank',!n);el.replaceChildren();if(n){const img=document.createElement('img');img.src=src(n);img.alt=`Page ${n} du livret Luméo`;img.draggable=false;el.append(img)}}
function render(){current=Math.min(current,maxIndex());const [l,r]=spread(current);paint(left,l);paint(right,r);counter.textContent=isMobile()?`${r} / ${TOTAL}`:l?`${l}${r?'–'+r:''} / ${TOTAL}`:`Couverture · 1 / ${TOTAL}`;document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===maxIndex()}
function go(to){if(busy||to<0||to>maxIndex()||to===current)return;const forward=to>current;const from=spread(current),dest=spread(to);busy=true;const mobile=isMobile();const flap=document.createElement('div');flap.className='turn '+(forward?'forward':'backward');const front=document.createElement('div'),back=document.createElement('div');front.className='turn-face';back.className='turn-face turn-back';const put=(el,n)=>{if(n){const im=document.createElement('img');im.src=src(n);im.alt='';el.append(im)}else el.style.background='#efe6f8'};put(front,mobile?from[1]:(forward?from[1]:from[0]));put(back,mobile?dest[1]:(forward?dest[0]:dest[1]));flap.append(front,back);book.append(flap);current=to;render();requestAnimationFrame(()=>requestAnimationFrame(()=>flap.classList.add('animate')));setTimeout(()=>{flap.remove();busy=false},740)}
document.getElementById('prev').onclick=()=>go(current-1);document.getElementById('next').onclick=()=>go(current+1);document.getElementById('first').onclick=()=>go(0);document.getElementById('last').onclick=()=>go(maxIndex());document.getElementById('full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(current+1);if(e.key==='ArrowLeft')go(current-1)});let start=null;book.addEventListener('touchstart',e=>start=e.changedTouches[0].clientX,{passive:true});book.addEventListener('touchend',e=>{if(start!==null){let d=e.changedTouches[0].clientX-start;if(Math.abs(d)>45)go(current+(d<0?1:-1));start=null}},{passive:true});let wasMobile=isMobile();window.addEventListener('resize',()=>{if(wasMobile!==isMobile()){wasMobile=isMobile();current=0;render()}});render();
</script></body></html>
